worker_processes 1;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    server {
        listen 8080;
        server_name _;

        # Health check
        location = /health {
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # Serve deployed apps at /d/{deployment_id}/
        # Files live at /deployments/{deployment_id}/
        location /d/ {
            alias /deployments/;
            autoindex on;
            # SPA fallback: try exact file, then index.html within the deployment subfolder
            try_files $uri $uri/ $uri/index.html =404;
        }

        # Deployments index
        location = / {
            return 200 "NORA Deployment Proxy — active\n";
            add_header Content-Type text/plain;
        }
    }
}
