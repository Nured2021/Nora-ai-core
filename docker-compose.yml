version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nora_postgres
    environment:
      POSTGRES_USER: nora
      POSTGRES_PASSWORD: nora_pass
      POSTGRES_DB: nora_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nora -d nora_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nora_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: nora_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://nora:nora_pass@postgres:5432/nora_db
      DATABASE_SYNC_URL: postgresql://nora:nora_pass@postgres:5432/nora_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SECRET_KEY: nora-super-secret-key-change-in-production-2024
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/api:/app
    restart: unless-stopped

  worker:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    container_name: nora_worker
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_SYNC_URL: postgresql://nora:nora_pass@postgres:5432/nora_db
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      WORKSPACE_ROOT: /workspace
      DASHBOARD_URL: http://localhost:3000
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/worker:/app
      - workspace_data:/workspace
    ports:
      - "3001-3010:3001-3010"
    restart: unless-stopped

  dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
    container_name: nora_dashboard
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  workspace_data:
